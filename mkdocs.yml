site_name: Kavita for Mere Mortals
site_description: A reading server for the books, comics and manga you already own. Putting a folder of EPUB, PDF and comic files on a small server, letting it organise them into series, and reading them in the browser or any OPDS reader app, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/kavita-for-mere-mortals/
copyright: 'Part of <a href="https://paulsullivan33-dev.github.io/mere-mortals/">For Mere Mortals</a> · Text <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>, code MIT'

